<!DOCTYPE html>
<html>
<head>
    <title>Multiplayer Robot Game</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: sans-serif;
            color: white;
        }
        canvas { 
            background: #1a1a24; 
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        const MAP_WIDTH = 2000;
        const MAP_HEIGHT = 2000;
        const PLAYER_SIZE = 30;

        // Rooms layout
        const rooms = [
            { name: "CAFETERIA", x: 800, y: 200, w: 400, h: 300 },
            { name: "ELECTRICAL", x: 200, y: 1200, w: 400, h: 400 },
            { name: "WEAPONS", x: 1400, y: 200, w: 400, h: 300 },
            { name: "STORAGE", x: 800, y: 1200, w: 400, h: 400 }
        ];

        // Solid Walls
        const walls = [
            { x: 700, y: 150, w: 600, h: 30 },
            { x: 700, y: 550, w: 600, h: 30 },
            { x: 150, y: 1150, w: 500, h: 30 },
            { x: 750, y: 1150, w: 500, h: 30 },
            { x: 1350, y: 150, w: 30, h: 400 },
            { x: 300, y: 600, w: 30, h: 550 }
        ];

        // Interactive Tasks
        let tasks = [
            { id: 1, x: 250, y: 1250, name: "Fix Wiring", completed: false },
            { id: 2, x: 950, y: 250, name: "Download Data", completed: false },
            { id: 3, x: 1500, y: 250, name: "Align Shields", completed: false },
            { id: 4, x: 950, y: 1400, name: "Empty Garbage", completed: false }
        ];

        let myX = 950;
        let myY = 350;
        
        const robotIcons = ["🤖", "🦾", "👾"];
        const myRobotIcon = robotIcons[Math.floor(Math.random() * robotIcons.length)];
        const myColor = `hsl(${Math.random() * 360}, 80%, 60%)`;

        let allPlayers = {};
        const keys = {};

        window.addEventListener("keydown", e => {
            keys[e.key.toLowerCase()] = true;
            // Press 'E' to interact with tasks
            if (e.key.toLowerCase() === "e") {
                checkTaskInteraction();
            }
        });
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            allPlayers = data.players;
        };

        function hitsWall(testX, testY) {
            for (const wall of walls) {
                if (
                    testX < wall.x + wall.w &&
                    testX + PLAYER_SIZE > wall.x &&
                    testY < wall.y + wall.h &&
                    testY + PLAYER_SIZE > wall.y
                ) {
                    return true;
                }
            }
            return false;
        }

        function checkTaskInteraction() {
            for (let task of tasks) {
                if (!task.completed) {
                    // Check if player is close to the task
                    const dist = Math.hypot((myX + PLAYER_SIZE/2) - task.x, (myY + PLAYER_SIZE/2) - task.y);
                    if (dist < 60) {
                        task.completed = true;
                        console.log(`Completed task: ${task.name}`);
                    }
                }
            }
        }

        function gameLoop() {
            const speed = 6;
            let nextX = myX;
            let nextY = myY;

            if (keys["arrowleft"] || keys["a"]) nextX -= speed;
            if (keys["arrowright"] || keys["d"]) nextX += speed;
            if (nextX >= 0 && nextX <= MAP_WIDTH - PLAYER_SIZE && !hitsWall(nextX, myY)) myX = nextX;

            if (keys["arrowup"] || keys["w"]) nextY -= speed;
            if (keys["arrowdown"] || keys["s"]) nextY += speed;
            if (nextY >= 0 && nextY <= MAP_HEIGHT - PLAYER_SIZE && !hitsWall(myX, nextY)) myY = nextY;

            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ x: myX, y: myY, color: myColor, icon: myRobotIcon }));
            }

            // Camera Tracking
            let cameraX = Math.max(0, Math.min(myX - canvas.width / 2, MAP_WIDTH - canvas.width));
            let cameraY = Math.max(0, Math.min(myY - canvas.height / 2, MAP_HEIGHT - canvas.height));

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            // 1. Draw Grid
            ctx.strokeStyle = "#252533";
            ctx.lineWidth = 2;
            const gridSize = 100;
            for (let x = 0; x <= MAP_WIDTH; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_HEIGHT); ctx.stroke();
            }
            for (let y = 0; y <= MAP_HEIGHT; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_WIDTH, y); ctx.stroke();
            }

            // 2. Draw Room Labels
            ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
            ctx.font = "bold 24px sans-serif";
            ctx.textAlign = "center";
            for (const room of rooms) {
                ctx.fillText(room.name, room.x + room.w / 2, room.y + room.h / 2);
            }

            // 3. Draw Walls
            for (const wall of walls) {
                ctx.fillStyle = "#3a3a4c";
                ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                ctx.strokeStyle = "#5a5a75";
                ctx.lineWidth = 3;
                ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
            }

            // 4. Draw Tasks
            for (const task of tasks) {
                ctx.fillStyle = task.completed ? "#00ff88" : "#ffcc00";
                ctx.beginPath();
                ctx.arc(task.x, task.y, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.font = "12px sans-serif";
                ctx.fillStyle = "#fff";
                ctx.fillText(task.name, task.x, task.y - 20);
            }

            // 5. Draw All Players
            for (const id in allPlayers) {
                const p = allPlayers[id];
                const cx = p.x + PLAYER_SIZE / 2;
                const cy = p.y + PLAYER_SIZE / 2;

                ctx.fillStyle = p.color || "#fff";
                ctx.beginPath();
                ctx.arc(cx, cy, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = "28px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(p.icon || "🤖", cx, cy);
            }

            ctx.restore();

            // --- FIELD OF VIEW LIGHT ---
            const screenPlayerX = (myX - cameraX) + PLAYER_SIZE / 2;
            const screenPlayerY = (myY - cameraY) + PLAYER_SIZE / 2;
            const fovRadius = 280;

            const gradient = ctx.createRadialGradient(
                screenPlayerX, screenPlayerY, fovRadius * 0.35,
                screenPlayerX, screenPlayerY, fovRadius
            );
            gradient.addColorStop(0, "rgba(0, 0, 0, 0)");
            gradient.addColorStop(1, "rgba(5, 5, 8, 0.97)");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // --- TOP-RIGHT MINIMAP ---
            const mapSize = 180;
            const mapX = canvas.width - mapSize - 20;
            const mapY = 20;
            const scale = mapSize / MAP_WIDTH;

            ctx.fillStyle = "rgba(10, 10, 15, 0.85)";
            ctx.fillRect(mapX, mapY, mapSize, mapSize);
            ctx.strokeStyle = "#444466";
            ctx.lineWidth = 2;
            ctx.strokeRect(mapX, mapY, mapSize, mapSize);

            // Draw walls on minimap
            ctx.fillStyle = "#555";
            for (const wall of walls) {
                ctx.fillRect(mapX + wall.x * scale, mapY + wall.y * scale, wall.w * scale, wall.h * scale);
            }

            // Draw tasks on minimap (yellow if active, green if done)
            for (const task of tasks) {
                ctx.fillStyle = task.completed ? "#00ff88" : "#ffcc00";
                ctx.fillRect(mapX + task.x * scale - 2, mapY + task.y * scale - 2, 4, 4);
            }

            // Draw other players on minimap as red/colored dots
            for (const id in allPlayers) {
                const p = allPlayers[id];
                ctx.fillStyle = p.color || "#fff";
                ctx.fillRect(mapX + p.x * scale, mapY + p.y * scale, 4, 4);
            }

            // Draw yourself on minimap as a bright white dot
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(mapX + myX * scale, mapY + myY * scale, 4, 0, Math.PI * 2);
            ctx.fill();

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
