<!DOCTYPE html>
<html>
<head>
    <title>SuspectZero // Multiplayer Deduction</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body { 
            margin: 0; 
            background: #05050a; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Share Tech Mono', monospace;
            color: #00ffcc;
        }

        #menu-screen, #lobby-screen {
            position: absolute;
            background: rgba(10, 10, 20, 0.96);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.25);
            text-align: center;
            width: 390px;
            border: 2px solid #00ffcc;
            z-index: 10;
        }

        #lobby-screen { display: none; }

        h2 {
            margin-top: 0;
            font-size: 28px;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #0d0d1a;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            border-radius: 4px;
            font-size: 16px;
            font-family: 'Share Tech Mono', monospace;
            box-sizing: border-box;
            outline: none;
        }

        input::placeholder { color: #008866; }

        button {
            background: #00ffcc;
            color: #05050a;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        button:hover { 
            background: #fff; 
            box-shadow: 0 0 18px #fff; 
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            margin: 12px 0;
            font-size: 14px;
            color: #00ffcc;
        }

        .checkbox-container input {
            width: 20px;
            margin-right: 10px;
            accent-color: #00ffcc;
        }

        #room-list, #player-lobby-list {
            max-height: 130px;
            overflow-y: auto;
            background: #05050a;
            border-radius: 4px;
            padding: 5px;
            margin-top: 10px;
            border: 1px solid #005544;
            text-align: left;
        }

        .room-item, .player-item {
            padding: 8px;
            background: #0d0d1a;
            margin: 4px 0;
            border-radius: 2px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            border-left: 3px solid #00ffcc;
        }

        .room-item:hover { background: #151530; }

        canvas { 
            display: none; 
            background: #070710; 
        }
    </style>
</head>
<body>

    <!-- MAIN MENU -->
    <div id="menu-screen">
        <h2>// SUSPECT_ZERO</h2>
        <input type="text" id="roomCodeInput" placeholder="ENTER SECTOR CODE">
        <button onclick="joinPrivateRoom()">JOIN PRIVATE SECTOR</button>
        
        <hr style="border-color: #005544; margin: 20px 0;">
        
        <div class="checkbox-container">
            <input type="checkbox" id="isPublicCheck" checked>
            <label for="isPublicCheck">BROADCAST PUBLIC SIGNAL</label>
        </div>
        <button onclick="createRoom()" style="background: #ff0055; border-color: #ff0055; color: #fff; box-shadow: 0 0 10px rgba(255,0,85,0.4);">CREATE NEW SECTOR</button>

        <h3 style="margin-top: 20px; font-size: 14px; text-align: left; color: #00ffcc;">ACTIVE SECTORS:</h3>
        <div id="room-list">
            <div style="color: #008866; font-size: 13px; padding: 10px;">SCANNING FREQUENCIES...</div>
        </div>
    </div>

    <!-- WAITING LOBBY -->
    <div id="lobby-screen">
        <h2>// STAGING BAY</h2>
        <p>SECTOR CODE: <b id="displayCode" style="color: #ff0055; font-size: 22px; letter-spacing: 2px;">----</b></p>
        <p style="font-size: 13px; color: #00aa88;">CONNECTED OPERATIVES:</p>
        <div id="player-lobby-list"></div>
        <button id="startMatchBtn" onclick="startMatch()" style="background: #ff0055; border-color: #ff0055; color: #fff; display: none; margin-top: 15px; box-shadow: 0 0 10px rgba(255,0,85,0.4);">DEPLOY TO STATION</button>
        <p id="waitingText" style="font-size: 13px; color: #ffbb00; margin-top: 10px;">AWAITING HOST DEPLOYMENT...</p>
    </div>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        // Expanded 3200 x 3200 Map
        const MAP_WIDTH = 3200;
        const MAP_HEIGHT = 3200;
        const PLAYER_SIZE = 32;

        // Unique Polygon-Shaped Rooms
        const rooms = [
            {
                name: "COMMAND DECK", // Octagon shape
                labelX: 1600, labelY: 500,
                color: "rgba(0, 255, 204, 0.06)",
                border: "#00ffcc",
                points: [
                    {x: 1350, y: 200}, {x: 1850, y: 200},
                    {x: 2050, y: 400}, {x: 2050, y: 700},
                    {x: 1850, y: 900}, {x: 1350, y: 900},
                    {x: 1150, y: 700}, {x: 1150, y: 400}
                ]
            },
            {
                name: "POWER CORE", // Cross / T-Shape
                labelX: 600, labelY: 1600,
                color: "rgba(255, 187, 0, 0.06)",
                border: "#ffbb00",
                points: [
                    {x: 400, y: 1200}, {x: 800, y: 1200},
                    {x: 800, y: 1450}, {x: 1050, y: 1450},
                    {x: 1050, y: 1850}, {x: 800, y: 1850},
                    {x: 800, y: 2100}, {x: 400, y: 2100},
                    {x: 400, y: 1850}, {x: 200, y: 1850},
                    {x: 200, y: 1450}, {x: 400, y: 1450}
                ]
            },
            {
                name: "ARMORY", // Hexagon / Wedge
                labelX: 2550, labelY: 1400,
                color: "rgba(255, 0, 85, 0.06)",
                border: "#ff0055",
                points: [
                    {x: 2300, y: 1000}, {x: 2800, y: 1000},
                    {x: 3000, y: 1400}, {x: 2800, y: 1800},
                    {x: 2300, y: 1800}, {x: 2150, y: 1400}
                ]
            },
            {
                name: "CARGO BAY", // L-Shape
                labelX: 1500, labelY: 2650,
                color: "rgba(138, 43, 226, 0.07)",
                border: "#a855f7",
                points: [
                    {x: 1100, y: 2200}, {x: 1650, y: 2200},
                    {x: 1650, y: 2550}, {x: 2200, y: 2550},
                    {x: 2200, y: 2950}, {x: 1100, y: 2950}
                ]
            },
            {
                name: "MEDBAY", // Diamond / Chamfered Square
                labelX: 2550, labelY: 2550,
                color: "rgba(56, 189, 248, 0.06)",
                border: "#38bdf8",
                points: [
                    {x: 2550, y: 2150}, {x: 2950, y: 2550},
                    {x: 2550, y: 2950}, {x: 2150, y: 2550}
                ]
            }
        ];

        // Solid Walls forming corridors & room boundaries
        const walls = [
            // Command Deck outer dividers
            { x: 1120, y: 180, w: 960, h: 25 },
            { x: 1120, y: 180, w: 25, h: 740 },
            { x: 2055, y: 180, w: 25, h: 740 },
            { x: 1120, y: 920, w: 380, h: 25 },
            { x: 1700, y: 920, w: 380, h: 25 },

            // Central Corridor Pillars
            { x: 1450, y: 1350, w: 300, h: 40 },
            { x: 1450, y: 1750, w: 300, h: 40 },

            // Power Core Walls
            { x: 180, y: 1180, w: 650, h: 25 },
            { x: 180, y: 1180, w: 25, h: 940 },
            { x: 180, y: 2120, w: 650, h: 25 },

            // Armory Walls
            { x: 2130, y: 980, w: 890, h: 25 },
            { x: 3000, y: 980, w: 25, h: 840 },
            { x: 2130, y: 1820, w: 890, h: 25 },

            // Cargo Bay Walls
            { x: 1080, y: 2180, w: 25, h: 800 },
            { x: 1080, y: 2980, w: 1140, h: 25 }
        ];

        let tasks = [
            { id: 1, x: 550, y: 1650, name: "STABILIZE REACTOR", completed: false },
            { id: 2, x: 1600, y: 350, name: "UPLOAD NAV DATA", completed: false },
            { id: 3, x: 2650, y: 1400, name: "CALIBRATE TURRETS", completed: false },
            { id: 4, x: 1350, y: 2700, name: "SCAN MANIFEST", completed: false },
            { id: 5, x: 2550, y: 2550, name: "RUN DIAGNOSTICS", completed: false }
        ];

        // Spawn inside Command Deck
        let myX = 1600, myY = 550;
        let myFacing = "right";
        let isMoving = false;
        let currentRoomCode = "";
        let isHost = false;
        let matchStarted = false;

        // Distinct Vibrant Cyber Suit Colors
        const suitColors = ["#ff2a55", "#00ffcc", "#ffbb00", "#a855f7", "#38bdf8", "#4ade80", "#fb923c", "#f472b6"];
        const myColor = suitColors[Math.floor(Math.random() * suitColors.length)];

        let allPlayers = {};
        const keys = {};

        ws.onopen = () => { fetchRooms(); setInterval(fetchRooms, 3000); };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === "room_list") {
                const listDiv = document.getElementById("room-list");
                if (data.rooms.length === 0) {
                    listDiv.innerHTML = '<div style="color: #008866; font-size: 13px; padding: 10px;">NO ACTIVE SECTORS FOUND.</div>';
                    return;
                }
                listDiv.innerHTML = "";
                data.rooms.forEach(r => {
                    listDiv.innerHTML += `<div class="room-item" onclick="joinPublicRoom('${r.code}')"><span>SECTOR: <b>${r.code}</b></span><span style="color: #ff0055;">${r.players} UNIT(S)</span></div>`;
                });
            } else if (data.type === "room_joined") {
                currentRoomCode = data.code;
                isHost = data.is_host;
                document.getElementById("menu-screen").style.display = "none";
                document.getElementById("lobby-screen").style.display = "block";
                document.getElementById("displayCode").innerText = currentRoomCode;

                if (isHost) {
                    document.getElementById("startMatchBtn").style.display = "block";
                    document.getElementById("waitingText").style.display = "none";
                }
            } else if (data.type === "match_started") {
                matchStarted = true;
                document.getElementById("lobby-screen").style.display = "none";
                canvas.style.display = "block";
                gameLoop();
            } else if (data.type === "game_state") {
                allPlayers = data.players;
                if (!matchStarted) {
                    const pList = document.getElementById("player-lobby-list");
                    pList.innerHTML = "";
                    for (const id in allPlayers) {
                        pList.innerHTML += `<div class="player-item"><span>OPERATIVE [${id}]</span><span style="color: #00ffcc;">READY</span></div>`;
                    }
                }
            } else if (data.type === "error") {
                alert(data.message);
            }
        };

        function fetchRooms() { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: "get_rooms" })); }
        function createRoom() { ws.send(JSON.stringify({ action: "create_room", is_public: document.getElementById("isPublicCheck").checked })); }
        function joinPrivateRoom() { 
            const code = document.getElementById("roomCodeInput").value;
            if (code) ws.send(JSON.stringify({ action: "join_room", code: code })); 
        }
        function joinPublicRoom(code) { ws.send(JSON.stringify({ action: "join_room", code: code })); }
        function startMatch() { ws.send(JSON.stringify({ action: "start_game" })); }

        window.addEventListener("keydown", e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === "e") checkTaskInteraction();
        });
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        function hitsWall(testX, testY) {
            for (const wall of walls) {
                if (testX < wall.x + wall.w && testX + PLAYER_SIZE > wall.x && testY < wall.y + wall.h && testY + PLAYER_SIZE > wall.y) return true;
            }
            return false;
        }

        function checkTaskInteraction() {
            for (let task of tasks) {
                if (!task.completed) {
                    const dist = Math.hypot((myX + PLAYER_SIZE / 2) - task.x, (myY + PLAYER_SIZE / 2) - task.y);
                    if (dist < 70) task.completed = true;
                }
            }
        }

        // Custom Vector Cyber-Operative Sprite Renderer
        function drawCharacterSprite(x, y, color, facing, moving) {
            ctx.save();
            ctx.translate(x + PLAYER_SIZE / 2, y + PLAYER_SIZE / 2);

            // Ground shadow
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
            ctx.beginPath();
            ctx.ellipse(0, 18, 16, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Flip horizontally if facing left
            if (facing === "left") ctx.scale(-1, 1);

            // Walking animation offset
            const walkCycle = moving ? Math.sin(Date.now() * 0.015) * 4 : 0;

            // Jetpack / Oxygen Tank
            ctx.fillStyle = "#1e293b";
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(-18, -8, 8, 20, 3);
            ctx.fill();
            ctx.stroke();

            // Animated Legs
            ctx.fillStyle = color;
            ctx.strokeStyle = "#05050a";
            ctx.lineWidth = 2;
            // Left Leg
            ctx.beginPath();
            ctx.roundRect(-9, 10 - walkCycle, 7, 10, 3);
            ctx.fill();
            ctx.stroke();
            // Right Leg
            ctx.beginPath();
            ctx.roundRect(2, 10 + walkCycle, 7, 10, 3);
            ctx.fill();
            ctx.stroke();

            // Main Armored Body
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(-12, -16, 24, 28, 10);
            ctx.fill();
            ctx.stroke();

            // Glowing Cyber Visor
            ctx.fillStyle = "#e0f2fe";
            ctx.shadowColor = "#38bdf8";
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.roundRect(0, -10, 14, 9, 4);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Visor Glint
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(3, -8, 6, 2);

            // Antenna
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-2, -16);
            ctx.lineTo(-5, -24);
            ctx.stroke();
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(-5, -24, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function gameLoop() {
            const speed = 7;
            let nextX = myX, nextY = myY;
            isMoving = false;

            if (keys["arrowleft"] || keys["a"]) { nextX -= speed; myFacing = "left"; isMoving = true; }
            if (keys["arrowright"] || keys["d"]) { nextX += speed; myFacing = "right"; isMoving = true; }
            if (nextX >= 0 && nextX <= MAP_WIDTH - PLAYER_SIZE && !hitsWall(nextX, myY)) myX = nextX;

            if (keys["arrowup"] || keys["w"]) { nextY -= speed; isMoving = true; }
            if (keys["arrowdown"] || keys["s"]) { nextY += speed; isMoving = true; }
            if (nextY >= 0 && nextY <= MAP_HEIGHT - PLAYER_SIZE && !hitsWall(myX, nextY)) myY = nextY;

            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: "player_update",
                    state: { x: myX, y: myY, color: myColor, facing: myFacing, moving: isMoving }
                }));
            }

            let cameraX = Math.max(0, Math.min(myX - canvas.width / 2, MAP_WIDTH - canvas.width));
            let cameraY = Math.max(0, Math.min(myY - canvas.height / 2, MAP_HEIGHT - canvas.height));

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            // Background Grid
            ctx.strokeStyle = "#101025";
            ctx.lineWidth = 2;
            for (let x = 0; x <= MAP_WIDTH; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_HEIGHT); ctx.stroke(); }
            for (let y = 0; y <= MAP_HEIGHT; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_WIDTH, y); ctx.stroke(); }

            // Outer Map Perimeter
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            // Draw Custom Polygon Rooms
            for (const room of rooms) {
                ctx.beginPath();
                ctx.moveTo(room.points[0].x, room.points[0].y);
                for (let i = 1; i < room.points.length; i++) {
                    ctx.lineTo(room.points[i].x, room.points[i].y);
                }
                ctx.closePath();

                ctx.fillStyle = room.color;
                ctx.fill();
                ctx.strokeStyle = room.border;
                ctx.lineWidth = 3;
                ctx.stroke();

                // Room Watermark Label
                ctx.fillStyle = room.border;
                ctx.globalAlpha = 0.45;
                ctx.font = "bold 28px 'Share Tech Mono', monospace";
                ctx.textAlign = "center";
                ctx.fillText(room.name, room.labelX, room.labelY);
                ctx.globalAlpha = 1.0;
            }

            // Draw Walls
            for (const wall of walls) {
                ctx.fillStyle = "#151525";
                ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                ctx.strokeStyle = "#ff0055";
                ctx.lineWidth = 2;
                ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
            }

            // Draw Tasks
            for (const task of tasks) {
                ctx.fillStyle = task.completed ? "#00ffcc" : "#ffbb00";
                ctx.beginPath();
                ctx.arc(task.x, task.y, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.font = "14px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.fillText(task.name + (task.completed ? " [COMPLETE]" : " [E]"), task.x, task.y - 22);
            }

            // Draw All Custom Character Sprites
            for (const id in allPlayers) {
                const p = allPlayers[id];
                drawCharacterSprite(p.x, p.y, p.color || "#00ffcc", p.facing || "right", p.moving || false);
            }

            ctx.restore();

            // Field of View Radius (Active once deployed)
            if (matchStarted) {
                const screenPlayerX = (myX - cameraX) + PLAYER_SIZE / 2;
                const screenPlayerY = (myY - cameraY) + PLAYER_SIZE / 2;
                const fovRadius = 330;

                const gradient = ctx.createRadialGradient(screenPlayerX, screenPlayerY, fovRadius * 0.3, screenPlayerX, screenPlayerY, fovRadius);
                gradient.addColorStop(0, "rgba(5, 5, 10, 0)");
                gradient.addColorStop(1, "rgba(2, 2, 5, 0.98)");
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Top-Left HUD Badge
            ctx.fillStyle = "rgba(10, 10, 20, 0.9)";
            ctx.fillRect(20, 20, 220, 45);
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 2;
            ctx.strokeRect(20, 20, 220, 45);
            ctx.fillStyle = "#00ffcc";
            ctx.font = "16px 'Share Tech Mono', monospace";
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText(`SUSPECT_ZERO // ${currentRoomCode}`, 32, 43);

            // --- TOP-RIGHT FULL LAYOUT MINIMAP ---
            const mapSize = 230;
            const mapX = canvas.width - mapSize - 20;
            const mapY = 20;
            const scale = mapSize / MAP_WIDTH;

            ctx.fillStyle = "rgba(8, 8, 16, 0.92)";
            ctx.fillRect(mapX, mapY, mapSize, mapSize);
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 2;
            ctx.strokeRect(mapX, mapY, mapSize, mapSize);

            // Render Polygon Room Shapes & Names on Minimap
            for (const room of rooms) {
                ctx.beginPath();
                ctx.moveTo(mapX + room.points[0].x * scale, mapY + room.points[0].y * scale);
                for (let i = 1; i < room.points.length; i++) {
                    ctx.lineTo(mapX + room.points[i].x * scale, mapY + room.points[i].y * scale);
                }
                ctx.closePath();
                ctx.fillStyle = room.color;
                ctx.fill();
                ctx.strokeStyle = room.border;
                ctx.lineWidth = 1;
                ctx.stroke();

                // Minimap Room Labels
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 8px 'Share Tech Mono', monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(room.name, mapX + room.labelX * scale, mapY + room.labelY * scale);
            }

            // Render Walls on Minimap
            ctx.fillStyle = "#ff0055";
            for (const wall of walls) {
                ctx.fillRect(mapX + wall.x * scale, mapY + wall.y * scale, Math.max(1.5, wall.w * scale), Math.max(1.5, wall.h * scale));
            }

            // Render Tasks on Minimap
            for (const task of tasks) {
                ctx.fillStyle = task.completed ? "#00ffcc" : "#ffbb00";
                ctx.beginPath();
                ctx.arc(mapX + task.x * scale, mapY + task.y * scale, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Render Player Blip (Your Position)
            ctx.fillStyle = "#ffffff";
            ctx.shadowColor = "#00ffcc";
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(mapX + (myX + PLAYER_SIZE / 2) * scale, mapY + (myY + PLAYER_SIZE / 2) * scale, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            requestAnimationFrame(gameLoop);
        }

        setInterval(() => {
            if (!matchStarted && currentRoomCode && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: "player_update",
                    state: { x: myX, y: myY, color: myColor, facing: myFacing, moving: isMoving }
                }));
            }
        }, 100);
    </script>
</body>
</html>
