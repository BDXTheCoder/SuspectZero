<!DOCTYPE html>
<html>
<head>
    <title>Multiplayer Robot Game</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: sans-serif;
            color: white;
        }
        /* Menu Screen UI styling */
        #menu-screen {
            position: absolute;
            background: #181820;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            width: 360px;
            border: 2px solid #333;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #252533;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: #4f46e5;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #6366f1; }
        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: start;
            margin: 10px 0;
            font-size: 14px;
        }
        .checkbox-container input {
            width: 20px;
            margin-right: 10px;
        }
        #room-list {
            max-height: 120px;
            overflow-y: auto;
            background: #121215;
            border-radius: 6px;
            padding: 5px;
            margin-top: 10px;
            border: 1px solid #333;
        }
        .room-item {
            padding: 8px;
            background: #22222e;
            margin: 4px 0;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .room-item:hover { background: #313145; }
        canvas { display: none; background: #1a1a24; }
    </style>
</head>
<body>

    <!-- START MENU SCREEN -->
    <div id="menu-screen">
        <h2>🤖 ROBOT ARENA</h2>
        <input type="text" id="roomCodeInput" placeholder="Enter Private Room Code">
        <button onclick="joinPrivateRoom()">Join Private Room</button>
        
        <hr style="border-color: #333; margin: 15px 0;">
        
        <div class="checkbox-container">
            <input type="checkbox" id="isPublicCheck" checked>
            <label for="isPublicCheck">Make Room Public</label>
        </div>
        <button onclick="createRoom()" style="background: #10b981;">Create New Room</button>

        <h3 style="margin-top: 20px; font-size: 14px; text-align: left;">Active Public Rooms:</h3>
        <div id="room-list">
            <div style="color: #777; font-size: 13px; padding: 10px;">Scanning for rooms...</div>
        </div>
    </div>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        const MAP_WIDTH = 2000;
        const MAP_HEIGHT = 2000;
        const PLAYER_SIZE = 30;

        let myX = 950, myY = 350;
        const robotIcons = ["🤖", "🦾", "👾"];
        const myRobotIcon = robotIcons[Math.floor(Math.random() * robotIcons.length)];
        const myColor = `hsl(${Math.random() * 360}, 80%, 60%)`;

        let allPlayers = {};
        const keys = {};

        ws.onopen = () => {
            // Request public rooms list on load
            fetchRooms();
            setInterval(fetchRooms, 3000); // Refresh public list every 3 seconds
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === "room_list") {
                const listDiv = document.getElementById("room-list");
                if (data.rooms.length === 0) {
                    listDiv.innerHTML = '<div style="color: #777; font-size: 13px; padding: 10px;">No public rooms found. Create one!</div>';
                    return;
                }
                listDiv.innerHTML = "";
                data.rooms.forEach(r => {
                    listDiv.innerHTML += `
                        <div class="room-item" onclick="joinPublicRoom('${r.code}')">
                            <span>Room: <b>${r.code}</b></span>
                            <span style="color: #10b981;">${r.players} player(s)</span>
                        </div>
                    `;
                });
            } else if (data.type === "room_joined") {
                // Hide menu, show game
                document.getElementById("menu-screen").style.display = "none";
                canvas.style.display = "block";
                gameLoop();
            } else if (data.type === "game_state") {
                allPlayers = data.players;
            } else if (data.type === "error") {
                alert(data.message);
            }
        };

        function fetchRooms() {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: "get_rooms" }));
            }
        }

        function createRoom() {
            const isPublic = document.getElementById("isPublicCheck").checked;
            ws.send(JSON.stringify({ action: "create_room", is_public: isPublic }));
        }

        function joinPrivateRoom() {
            const code = document.getElementById("roomCodeInput").value;
            if (!code) {
                alert("Please enter a room code!");
                return;
            }
            ws.send(JSON.stringify({ action: "join_room", code: code }));
        }

        function joinPublicRoom(code) {
            ws.send(JSON.stringify({ action: "join_room", code: code }));
        }

        // Keyboard tracking
        window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        function gameLoop() {
            const speed = 6;
            if ((keys["arrowleft"] || keys["a"]) && myX > 0) myX -= speed;
            if ((keys["arrowright"] || keys["d"]) && myX < MAP_WIDTH - PLAYER_SIZE) myX += speed;
            if ((keys["arrowup"] || keys["w"]) && myY > 0) myY -= speed;
            if ((keys["arrowdown"] || keys["s"]) && myY < MAP_HEIGHT - PLAYER_SIZE) myY += speed;

            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: "player_update",
                    state: { x: myX, y: myY, color: myColor, icon: myRobotIcon }
                }));
            }

            let cameraX = Math.max(0, Math.min(myX - canvas.width / 2, MAP_WIDTH - canvas.width));
            let cameraY = Math.max(0, Math.min(myY - canvas.height / 2, MAP_HEIGHT - canvas.height));

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            // Draw grid lines
            ctx.strokeStyle = "#252533";
            ctx.lineWidth = 2;
            const gridSize = 100;
            for (let x = 0; x <= MAP_WIDTH; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_HEIGHT); ctx.stroke();
            }
            for (let y = 0; y <= MAP_HEIGHT; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_WIDTH, y); ctx.stroke();
            }

            // Draw all players in room
            for (const id in allPlayers) {
                const p = allPlayers[id];
                const cx = p.x + PLAYER_SIZE / 2;
                const cy = p.y + PLAYER_SIZE / 2;

                ctx.fillStyle = p.color || "#fff";
                ctx.beginPath();
                ctx.arc(cx, cy, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = "28px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(p.icon || "🤖", cx, cy);
            }

            ctx.restore();

            // Field of view lighting overlay
            const screenPlayerX = (myX - cameraX) + PLAYER_SIZE / 2;
            const screenPlayerY = (myY - cameraY) + PLAYER_SIZE / 2;
            const fovRadius = 280;

            const gradient = ctx.createRadialGradient(
                screenPlayerX, screenPlayerY, fovRadius * 0.35,
                screenPlayerX, screenPlayerY, fovRadius
            );
            gradient.addColorStop(0, "rgba(0, 0, 0, 0)");
            gradient.addColorStop(1, "rgba(5, 5, 8, 0.97)");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
