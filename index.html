<!DOCTYPE html>
<html>
<head>
    <title>Multiplayer Robot Game</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            overflow: hidden; /* Prevents scrollbars on the window */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        canvas { 
            background: #1a1a24; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Make the canvas take up the full browser window
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Automatically use wss:// on Render, or ws:// when testing locally
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        // Large map size (larger than the window screen)
        const MAP_WIDTH = 2000;
        const MAP_HEIGHT = 2000;

        let myX = Math.random() * (MAP_WIDTH - 200) + 100;
        let myY = Math.random() * (MAP_HEIGHT - 200) + 100;
        
        // Assign a random robot style or color theme
        const robotColors = ["🤖", "🦾", "👾", "🤖"];
        const myRobotIcon = robotColors[Math.floor(Math.random() * robotColors.length)];
        const myColor = `hsl(${Math.random() * 360}, 80%, 60%)`;

        let allPlayers = {};
        const keys = {};

        // Track keyboard input
        window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        // Receive player data from server
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            allPlayers = data.players;
        };

        function gameLoop() {
            const speed = 6;
            // Move within map boundaries
            if ((keys["arrowleft"] || keys["a"]) && myX > 0) myX -= speed;
            if ((keys["arrowright"] || keys["d"]) && myX < MAP_WIDTH) myX += speed;
            if ((keys["arrowup"] || keys["w"]) && myY > 0) myY -= speed;
            if ((keys["arrowdown"] || keys["s"]) && myY < MAP_HEIGHT) myY += speed;

            // Send our position to the server
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ x: myX, y: myY, color: myColor, icon: myRobotIcon }));
            }

            // --- CAMERA / VIEWPORT LOGIC ---
            // Center the camera on our player
            let cameraX = myX - canvas.width / 2;
            let cameraY = myY - canvas.height / 2;

            // Clamp camera so it doesn't show outside the map edges
            cameraX = Math.max(0, Math.min(cameraX, MAP_WIDTH - canvas.width));
            cameraY = Math.max(0, Math.min(cameraY, MAP_HEIGHT - canvas.height));

            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // Shift everything to simulate camera movement
            ctx.translate(-cameraX, -cameraY);

            // 1. Draw Map Grid Background (so you can tell you're moving)
            ctx.strokeStyle = "#252533";
            ctx.lineWidth = 2;
            const gridSize = 100;
            for (let x = 0; x < MAP_WIDTH; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, MAP_HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y < MAP_HEIGHT; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(MAP_WIDTH, y);
                ctx.stroke();
            }

            // 2. Draw all players (Robots)
            for (const id in allPlayers) {
                const p = allPlayers[id];
                
                // Draw robot glow/shadow
                ctx.fillStyle = p.color || "#fff";
                ctx.beginPath();
                ctx.arc(p.x + 15, p.y + 15, 20, 0, Math.PI * 2);
                ctx.fill();

                // Draw Robot Sprite/Emoji
                ctx.font = "30px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(p.icon || "🤖", p.x + 15, p.y + 15);
            }

            ctx.restore(); // Restore context before drawing UI/Fog of War

            // --- FIELD OF VIEW / RADAR SHADOW EFFECT ---
            // Creates a dark overlay with a transparent hole cut out around the player
            const fovRadius = 250; // Radius of visibility
            const gradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, fovRadius * 0.4,
                canvas.width / 2, canvas.height / 2, fovRadius
            );
            gradient.addColorStop(0, "rgba(0, 0, 0, 0)");       // Clear center (fully visible)
            gradient.addColorStop(1, "rgba(5, 5, 8, 0.95)");     // Dark outer edges

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
