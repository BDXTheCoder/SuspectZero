<!DOCTYPE html>
<html>
<head>
    <title>Multiplayer Robot Game</title>
    <style>
        body { 
            margin: 0; background: #111; overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; font-family: sans-serif; color: white; 
        }
        #menu-screen, #lobby-screen {
            position: absolute; background: #181820; padding: 40px; 
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            text-align: center; width: 380px; border: 2px solid #333; z-index: 10;
        }
        #lobby-screen { display: none; }
        input, button {
            width: 100%; padding: 12px; margin: 8px 0; background: #252533; 
            border: 1px solid #444; color: white; border-radius: 6px; font-size: 16px; box-sizing: border-box;
        }
        button { background: #4f46e5; cursor: pointer; font-weight: bold; }
        button:hover { background: #6366f1; }
        .checkbox-container { display: flex; align-items: center; margin: 10px 0; font-size: 14px; }
        .checkbox-container input { width: 20px; margin-right: 10px; }
        #room-list, #player-lobby-list {
            max-height: 120px; overflow-y: auto; background: #121215; 
            border-radius: 6px; padding: 5px; margin-top: 10px; border: 1px solid #333; text-align: left;
        }
        .room-item, .player-item {
            padding: 8px; background: #22222e; margin: 4px 0; border-radius: 4px; display: flex; justify-content: space-between;
        }
        canvas { display: none; background: #1a1a24; }
    </style>
</head>
<body>

    <!-- MAIN MENU -->
    <div id="menu-screen">
        <h2>🤖 ROBOT ARENA</h2>
        <input type="text" id="roomCodeInput" placeholder="Enter Private Room Code">
        <button onclick="joinPrivateRoom()">Join Private Room</button>
        <hr style="border-color: #333; margin: 15px 0;">
        <div class="checkbox-container">
            <input type="checkbox" id="isPublicCheck" checked>
            <label for="isPublicCheck">Make Room Public</label>
        </div>
        <button onclick="createRoom()" style="background: #10b981;">Create New Room</button>
        <h3 style="margin-top: 15px; font-size: 14px; text-align: left;">Active Public Rooms:</h3>
        <div id="room-list"><div style="color: #777; font-size: 13px; padding: 10px;">Scanning...</div></div>
    </div>

    <!-- WAITING LOBBY SCREEN -->
    <div id="lobby-screen">
        <h2>LOBBY WAITING ROOM</h2>
        <p>Room Code: <b id="displayCode" style="color: #10b981; font-size: 20px;">----</b></p>
        <p style="font-size: 13px; color: #aaa;">Players waiting to start:</p>
        <div id="player-lobby-list"></div>
        <button id="startMatchBtn" onclick="startMatch()" style="background: #10b981; display: none; margin-top: 15px;">Start Match</button>
        <p id="waitingText" style="font-size: 13px; color: #f59e0b; margin-top: 10px;">Waiting for host to start match...</p>
    </div>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        const MAP_WIDTH = 2000;
        const MAP_HEIGHT = 2000;
        const PLAYER_SIZE = 30;

        const rooms = [
            { name: "CAFETERIA", x: 800, y: 200, w: 400, h: 300 },
            { name: "ELECTRICAL", x: 200, y: 1200, w: 400, h: 400 },
            { name: "WEAPONS", x: 1400, y: 200, w: 400, h: 300 },
            { name: "STORAGE", x: 800, y: 1200, w: 400, h: 400 }
        ];
        const walls = [
            { x: 700, y: 150, w: 600, h: 30 }, { x: 700, y: 550, w: 600, h: 30 },
            { x: 150, y: 1150, w: 500, h: 30 }, { x: 750, y: 1150, w: 500, h: 30 },
            { x: 1350, y: 150, w: 30, h: 400 }, { x: 300, y: 600, w: 30, h: 550 }
        ];

        let myX = 950, myY = 350;
        let currentRoomCode = "";
        let isHost = false;
        let matchStarted = false; // Controls whether flashlight vision is active!

        const robotIcons = ["🤖", "🦾", "👾"];
        const myRobotIcon = robotIcons[Math.floor(Math.random() * robotIcons.length)];
        const myColor = `hsl(${Math.random() * 360}, 80%, 60%)`;

        let allPlayers = {};
        const keys = {};

        ws.onopen = () => { fetchRooms(); setInterval(fetchRooms, 3000); };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === "room_list") {
                const listDiv = document.getElementById("room-list");
                if (data.rooms.length === 0) {
                    listDiv.innerHTML = '<div style="color: #777; font-size: 13px; padding: 10px;">No public rooms found.</div>';
                    return;
                }
                listDiv.innerHTML = "";
                data.rooms.forEach(r => {
                    listDiv.innerHTML += `<div class="room-item" onclick="joinPublicRoom('${r.code}')"><span>Room: <b>${r.code}</b></span><span style="color: #10b981;">${r.players} player(s)</span></div>`;
                });
            } else if (data.type === "room_joined") {
                currentRoomCode = data.code;
                isHost = data.is_host;
                document.getElementById("menu-screen").style.display = "none";
                document.getElementById("lobby-screen").style.display = "block";
                document.getElementById("displayCode").innerText = currentRoomCode;

                if (isHost) {
                    document.getElementById("startMatchBtn").style.display = "block";
                    document.getElementById("waitingText").style.display = "none";
                }
            } else if (data.type === "match_started") {
                // Transition from lobby into actual game map!
                matchStarted = true;
                document.getElementById("lobby-screen").style.display = "none";
                canvas.style.display = "block";
                gameLoop();
            } else if (data.type === "game_state") {
                allPlayers = data.players;
                // Update lobby player list if still in lobby
                if (!matchStarted) {
                    const pList = document.getElementById("player-lobby-list");
                    pList.innerHTML = "";
                    for (const id in allPlayers) {
                        pList.innerHTML += `<div class="player-item"><span>Robot Player</span><span style="color: #10b981;">Ready</span></div>`;
                    }
                }
            } else if (data.type === "error") {
                alert(data.message);
            }
        };

        function fetchRooms() { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: "get_rooms" })); }
        function createRoom() { ws.send(JSON.stringify({ action: "create_room", is_public: document.getElementById("isPublicCheck").checked })); }
        function joinPrivateRoom() { 
            const code = document.getElementById("roomCodeInput").value;
            if (code) ws.send(JSON.stringify({ action: "join_room", code: code })); 
        }
        function joinPublicRoom(code) { ws.send(JSON.stringify({ action: "join_room", code: code })); }
        function startMatch() { ws.send(JSON.stringify({ action: "start_game" })); }

        window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        function hitsWall(testX, testY) {
            for (const wall of walls) {
                if (testX < wall.x + wall.w && testX + PLAYER_SIZE > wall.x && testY < wall.y + wall.h && testY + PLAYER_SIZE > wall.y) return true;
            }
            return false;
        }

        function gameLoop() {
            const speed = 6;
            let nextX = myX, nextY = myY;

            if (keys["arrowleft"] || keys["a"]) nextX -= speed;
            if (keys["arrowright"] || keys["d"]) nextX += speed;
            if (nextX >= 0 && nextX <= MAP_WIDTH - PLAYER_SIZE && !hitsWall(nextX, myY)) myX = nextX;

            if (keys["arrowup"] || keys["w"]) nextY -= speed;
            if (keys["arrowdown"] || keys["s"]) nextY += speed;
            if (nextY >= 0 && nextY <= MAP_HEIGHT - PLAYER_SIZE && !hitsWall(myX, nextY)) myY = nextY;

            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: "player_update", state: { x: myX, y: myY, color: myColor, icon: myRobotIcon } }));
            }

            let cameraX = Math.max(0, Math.min(myX - canvas.width / 2, MAP_WIDTH - canvas.width));
            let cameraY = Math.max(0, Math.min(myY - canvas.height / 2, MAP_HEIGHT - canvas.height));

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            // Draw grid & rooms
            ctx.strokeStyle = "#252533"; ctx.lineWidth = 2;
            for (let x = 0; x <= MAP_WIDTH; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_HEIGHT); ctx.stroke(); }
            for (let y = 0; y <= MAP_HEIGHT; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_WIDTH, y); ctx.stroke(); }

            for (const room of rooms) {
                ctx.fillStyle = "rgba(255, 255, 255, 0.2)"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(room.name, room.x + room.w / 2, room.y + room.h / 2);
            }

            for (const wall of walls) {
                ctx.fillStyle = "#3a3a4c"; ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                ctx.strokeStyle = "#5a5a75"; ctx.lineWidth = 3; ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
            }

            for (const id in allPlayers) {
                const p = allPlayers[id];
                ctx.fillStyle = p.color || "#fff"; ctx.beginPath(); ctx.arc(p.x + 15, p.y + 15, 20, 0, Math.PI * 2); ctx.fill();
                ctx.font = "28px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(p.icon || "🤖", p.x + 15, p.y + 15);
            }

            ctx.restore();

            // ONLY apply the flashlight / FOV radius shadow when the match has officially started!
            if (matchStarted) {
                const screenPlayerX = (myX - cameraX) + PLAYER_SIZE / 2;
                const screenPlayerY = (myY - cameraY) + PLAYER_SIZE / 2;
                const fovRadius = 280;

                const gradient = ctx.createRadialGradient(screenPlayerX, screenPlayerY, fovRadius * 0.35, screenPlayerX, screenPlayerY, fovRadius);
                gradient.addColorStop(0, "rgba(0, 0, 0, 0)");
                gradient.addColorStop(1, "rgba(5, 5, 8, 0.97)");
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            requestAnimationFrame(gameLoop);
        }

        // Keep sending player position while in the waiting lobby so everyone appears in the list
        setInterval(() => {
            if (!matchStarted && currentRoomCode && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: "player_update", state: { x: myX, y: myY, color: myColor, icon: myRobotIcon } }));
            }
        }, 100);
    </script>
</body>
</html>
