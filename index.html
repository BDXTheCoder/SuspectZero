<!DOCTYPE html>
<html>
<head>
    <title>CYBER-NET // Multiplayer Arena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body { 
            margin: 0; 
            background: #05050a; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Share Tech Mono', monospace;
            color: #00ffcc;
        }

        #menu-screen {
            position: absolute;
            background: rgba(10, 10, 20, 0.95);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            text-align: center;
            width: 380px;
            border: 2px solid #00ffcc;
            z-index: 10;
        }

        #lobby-screen {
            position: absolute;
            background: rgba(10, 10, 20, 0.95);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            text-align: center;
            width: 380px;
            border: 2px solid #00ffcc;
            display: none;
            z-index: 10;
        }

        h2 {
            margin-top: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #0d0d1a;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            border-radius: 4px;
            font-size: 16px;
            font-family: 'Share Tech Mono', monospace;
            box-sizing: border-box;
            outline: none;
        }

        input::placeholder { color: #008866; }

        button {
            background: #00ffcc;
            color: #05050a;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        button:hover { 
            background: #fff; 
            box-shadow: 0 0 15px #fff; 
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            margin: 12px 0;
            font-size: 14px;
            color: #00ffcc;
        }

        .checkbox-container input {
            width: 20px;
            margin-right: 10px;
            accent-color: #00ffcc;
        }

        #room-list, #player-lobby-list {
            max-height: 120px;
            overflow-y: auto;
            background: #05050a;
            border-radius: 4px;
            padding: 5px;
            margin-top: 10px;
            border: 1px solid #005544;
            text-align: left;
        }

        .room-item, .player-item {
            padding: 8px;
            background: #0d0d1a;
            margin: 4px 0;
            border-radius: 2px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            border-left: 3px solid #00ffcc;
        }

        .room-item:hover { background: #151530; }

        canvas { 
            display: none; 
            background: #070710; 
        }
    </style>
</head>
<body>

    <!-- MAIN MENU -->
    <div id="menu-screen">
        <h2>// CYBER_ARENA</h2>
        <input type="text" id="roomCodeInput" placeholder="ENTER ROOM CODE">
        <button onclick="joinPrivateRoom()">ACCESS PRIVATE ROOM</button>
        
        <hr style="border-color: #005544; margin: 20px 0;">
        
        <div class="checkbox-container">
            <input type="checkbox" id="isPublicCheck" checked>
            <label for="isPublicCheck">BROADCAST PUBLIC SIGNAL</label>
        </div>
        <button onclick="createRoom()" style="background: #ff0055; border-color: #ff0055; color: #fff; box-shadow: 0 0 10px rgba(255,0,85,0.4);">INITIALIZE NEW ROOM</button>

        <h3 style="margin-top: 20px; font-size: 14px; text-align: left; color: #00ffcc;">ACTIVE SECTORS:</h3>
        <div id="room-list">
            <div style="color: #008866; font-size: 13px; padding: 10px;">SCANNING FREQUENCIES...</div>
        </div>
    </div>

    <!-- WAITING LOBBY -->
    <div id="lobby-screen">
        <h2>// SECTOR WAITING LOBBY</h2>
        <p>SECTOR CODE: <b id="displayCode" style="color: #ff0055; font-size: 22px; letter-spacing: 2px;">----</b></p>
        <p style="font-size: 13px; color: #00aa88;">CONNECTED UNITS:</p>
        <div id="player-lobby-list"></div>
        <button id="startMatchBtn" onclick="startMatch()" style="background: #ff0055; border-color: #ff0055; color: #fff; display: none; margin-top: 15px; box-shadow: 0 0 10px rgba(255,0,85,0.4);">INITIATE PROTOCOL</button>
        <p id="waitingText" style="font-size: 13px; color: #ffbb00; margin-top: 10px;">AWAITING COMMANDER INITIALIZATION...</p>
    </div>

    <!-- GAME CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        const MAP_WIDTH = 2000;
        const MAP_HEIGHT = 2000;
        const PLAYER_SIZE = 30;

        const rooms = [
            { name: "COMMAND DECK", x: 800, y: 200, w: 400, h: 300 },
            { name: "POWER CORE", x: 200, y: 1200, w: 400, h: 400 },
            { name: "ARMORY", x: 1400, y: 200, w: 400, h: 300 },
            { name: "CARGO BAY", x: 800, y: 1200, w: 400, h: 400 }
        ];

        const walls = [
            { x: 700, y: 150, w: 600, h: 30 }, { x: 700, y: 550, w: 600, h: 30 },
            { x: 150, y: 1150, w: 500, h: 30 }, { x: 750, y: 1150, w: 500, h: 30 },
            { x: 1350, y: 150, w: 30, h: 400 }, { x: 300, y: 600, w: 30, h: 550 }
        ];

        let tasks = [
            { id: 1, x: 250, y: 1250, name: "REWIRE GRID", completed: false },
            { id: 2, x: 950, y: 250, name: "DOWNLOAD DATA", completed: false },
            { id: 3, x: 1500, y: 250, name: "ALIGN SHIELDS", completed: false },
            { id: 4, x: 950, y: 1400, name: "PURGE VENT", completed: false }
        ];

        let myX = 950, myY = 350;
        let currentRoomCode = "";
        let isHost = false;
        let matchStarted = false;

        const robotIcons = ["🤖", "🦾", "👾", "🛸"];
        const myRobotIcon = robotIcons[Math.floor(Math.random() * robotIcons.length)];
        const myColor = `hsl(${Math.random() * 360}, 100%, 60%)`;

        let allPlayers = {};
        const keys = {};

        ws.onopen = () => { fetchRooms(); setInterval(fetchRooms, 3000); };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === "room_list") {
                const listDiv = document.getElementById("room-list");
                if (data.rooms.length === 0) {
                    listDiv.innerHTML = '<div style="color: #008866; font-size: 13px; padding: 10px;">NO ACTIVE SECTORS FOUND.</div>';
                    return;
                }
                listDiv.innerHTML = "";
                data.rooms.forEach(r => {
                    listDiv.innerHTML += `<div class="room-item" onclick="joinPublicRoom('${r.code}')"><span>SECTOR: <b>${r.code}</b></span><span style="color: #ff0055;">${r.players} UNIT(S)</span></div>`;
                });
            } else if (data.type === "room_joined") {
                currentRoomCode = data.code;
                isHost = data.is_host;
                document.getElementById("menu-screen").style.display = "none";
                document.getElementById("lobby-screen").style.display = "block";
                document.getElementById("displayCode").innerText = currentRoomCode;

                if (isHost) {
                    document.getElementById("startMatchBtn").style.display = "block";
                    document.getElementById("waitingText").style.display = "none";
                }
            } else if (data.type === "match_started") {
                matchStarted = true;
                document.getElementById("lobby-screen").style.display = "none";
                canvas.style.display = "block";
                gameLoop();
            } else if (data.type === "game_state") {
                allPlayers = data.players;
                if (!matchStarted) {
                    const pList = document.getElementById("player-lobby-list");
                    pList.innerHTML = "";
                    for (const id in allPlayers) {
                        pList.innerHTML += `<div class="player-item"><span>CYBER UNIT</span><span style="color: #00ffcc;">READY</span></div>`;
                    }
                }
            } else if (data.type === "error") {
                alert(data.message);
            }
        };

        function fetchRooms() { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: "get_rooms" })); }
        function createRoom() { ws.send(JSON.stringify({ action: "create_room", is_public: document.getElementById("isPublicCheck").checked })); }
        function joinPrivateRoom() { 
            const code = document.getElementById("roomCodeInput").value;
            if (code) ws.send(JSON.stringify({ action: "join_room", code: code })); 
        }
        function joinPublicRoom(code) { ws.send(JSON.stringify({ action: "join_room", code: code })); }
        function startMatch() { ws.send(JSON.stringify({ action: "start_game" })); }

        window.addEventListener("keydown", e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === "e") checkTaskInteraction();
        });
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        function hitsWall(testX, testY) {
            for (const wall of walls) {
                if (testX < wall.x + wall.w && testX + PLAYER_SIZE > wall.x && testY < wall.y + wall.h && testY + PLAYER_SIZE > wall.y) return true;
            }
            return false;
        }

        function checkTaskInteraction() {
            for (let task of tasks) {
                if (!task.completed) {
                    const dist = Math.hypot((myX + PLAYER_SIZE / 2) - task.x, (myY + PLAYER_SIZE / 2) - task.y);
                    if (dist < 60) task.completed = true;
                }
            }
        }

        function gameLoop() {
            const speed = 6;
            let nextX = myX, nextY = myY;

            if (keys["arrowleft"] || keys["a"]) nextX -= speed;
            if (keys["arrowright"] || keys["d"]) nextX += speed;
            if (nextX >= 0 && nextX <= MAP_WIDTH - PLAYER_SIZE && !hitsWall(nextX, myY)) myX = nextX;

            if (keys["arrowup"] || keys["w"]) nextY -= speed;
            if (keys["arrowdown"] || keys["s"]) nextY += speed;
            if (nextY >= 0 && nextY <= MAP_HEIGHT - PLAYER_SIZE && !hitsWall(myX, nextY)) myY = nextY;

            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: "player_update", state: { x: myX, y: myY, color: myColor, icon: myRobotIcon } }));
            }

            let cameraX = Math.max(0, Math.min(myX - canvas.width / 2, MAP_WIDTH - canvas.width));
            let cameraY = Math.max(0, Math.min(myY - canvas.height / 2, MAP_HEIGHT - canvas.height));

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            // Neon Cyber Grid
            ctx.strokeStyle = "#101025";
            ctx.lineWidth = 2;
            for (let x = 0; x <= MAP_WIDTH; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_HEIGHT); ctx.stroke(); }
            for (let y = 0; y <= MAP_HEIGHT; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_WIDTH, y); ctx.stroke(); }

            // Outer Boundary
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            // Rooms
            for (const room of rooms) {
                ctx.fillStyle = "rgba(0, 255, 204, 0.05)";
                ctx.fillRect(room.x, room.y, room.w, room.h);
                ctx.strokeStyle = "#005544";
                ctx.lineWidth = 2;
                ctx.strokeRect(room.x, room.y, room.w, room.h);

                ctx.fillStyle = "#00ffcc";
                ctx.font = "bold 24px 'Share Tech Mono', monospace";
                ctx.textAlign = "center";
                ctx.fillText(room.name, room.x + room.w / 2, room.y + 40);
            }

            // High-Tech Walls
            for (const wall of walls) {
                ctx.fillStyle = "#151525";
                ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                ctx.strokeStyle = "#ff0055";
                ctx.lineWidth = 2;
                ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
            }

            // Tasks
            for (const task of tasks) {
                ctx.fillStyle = task.completed ? "#00ffcc" : "#ffbb00";
                ctx.beginPath();
                ctx.arc(task.x, task.y, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.font = "14px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#fff";
                ctx.fillText(task.name + (task.completed ? " [ONLINE]" : " [PRESS E]"), task.x, task.y - 20);
            }

            // Players
            for (const id in allPlayers) {
                const p = allPlayers[id];
                ctx.fillStyle = p.color || "#fff";
                ctx.beginPath();
                ctx.arc(p.x + 15, p.y + 15, 18, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = "26px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(p.icon || "🤖", p.x + 15, p.y + 15);
            }

            ctx.restore();

            // Flashlight / Scanner Radius when match active
            if (matchStarted) {
                const screenPlayerX = (myX - cameraX) + PLAYER_SIZE / 2;
                const screenPlayerY = (myY - cameraY) + PLAYER_SIZE / 2;
                const fovRadius = 300;

                const gradient = ctx.createRadialGradient(screenPlayerX, screenPlayerY, fovRadius * 0.3, screenPlayerX, screenPlayerY, fovRadius);
                gradient.addColorStop(0, "rgba(5, 5, 10, 0)");
                gradient.addColorStop(1, "rgba(2, 2, 5, 0.98)");
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // HUD Overlays
            ctx.fillStyle = "rgba(10, 10, 20, 0.85)";
            ctx.fillRect(20, 20, 180, 45);
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 2;
            ctx.strokeRect(20, 20, 180, 45);
            ctx.fillStyle = "#00ffcc";
            ctx.font = "16px 'Share Tech Mono', monospace";
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText(`SECTOR: ${currentRoomCode}`, 32, 43);

            // Minimap
            const mapSize = 180;
            const mapX = canvas.width - mapSize - 20;
            const mapY = 20;
            const scale = mapSize / MAP_WIDTH;

            ctx.fillStyle = "rgba(10, 10, 20, 0.85)";
            ctx.fillRect(mapX, mapY, mapSize, mapSize);
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 2;
            ctx.strokeRect(mapX, mapY, mapSize, mapSize);

            ctx.fillStyle = "#151525";
            for (const wall of walls) {
                ctx.fillRect(mapX + wall.x * scale, mapY + wall.y * scale, wall.w * scale, wall.h * scale);
            }

            for (const task of tasks) {
                ctx.fillStyle = task.completed ? "#00ffcc" : "#ffbb00";
                ctx.fillRect(mapX + task.x * scale - 2, mapY + task.y * scale - 2, 4, 4);
            }

            for (const id in allPlayers) {
                const p = allPlayers[id];
                ctx.fillStyle = p.color || "#fff";
                ctx.fillRect(mapX + p.x * scale, mapY + p.y * scale, 4, 4);
            }

            ctx.fillStyle = "#ff0055";
            ctx.beginPath();
            ctx.arc(mapX + myX * scale, mapY + myY * scale, 4, 0, Math.PI * 2);
            ctx.fill();

            requestAnimationFrame(gameLoop);
        }

        setInterval(() => {
            if (!matchStarted && currentRoomCode && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: "player_update", state: { x: myX, y: myY, color: myColor, icon: myRobotIcon } }));
            }
        }, 100);
    </script>
</body>
</html>
